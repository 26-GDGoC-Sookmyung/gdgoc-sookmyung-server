app.public-url=${APP_PUBLIC_URL:http://localhost:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Seoul';

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

google.sheets.spreadsheet-id=${GOOGLE_SPREADSHEET_ID}
google.sheets.credentials-location=${GOOGLE_SHEETS_CREDENTIALS_LOCATION:classpath:google/service-account.json}
mail.admin-email=${ADMIN_EMAIL}
# 모집기간동안에는 true로 변경 필요
sheets.sync.scheduler.enabled=false

spring.task.scheduling.pool.size=1

# Resend ?? ?? ??
mail.api-key=${RESEND_API_KEY}
mail.sender-name=GDGoC Sookmyung
mail.sender-email=noreply@gdgoc-sookmyung.com
mail.connect-timeout-ms=5000
mail.read-timeout-ms=10000

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-validity-in-ms=3600000
jwt.refresh-token-validity-in-ms=604800000