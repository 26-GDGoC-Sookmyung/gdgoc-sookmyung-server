mail.api-key=${RESEND_API_KEY}
mail.sender-name=GDGoC Sookmyung
mail.sender-email=noreply@gdgoc-sookmyung.com
mail.connect-timeout-ms=5000
mail.read-timeout-ms=10000

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-validity-in-ms=360000
jwt.refresh-token-validity-in-ms=604800000